[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "infinity-core/=lib/infinity-core/",
  "solmate/=lib/solmate/"
]
solc = "0.8.26"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
lint = { lint_on_build = false }
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
local = "http://127.0.0.1:8546"
